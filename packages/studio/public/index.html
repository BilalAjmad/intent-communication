<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intent Studio</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="topbar" role="banner">
      <span class="brand">Intent&nbsp;Studio</span>
      <span class="project" id="project-name">Loading…</span>
      <label class="screen-switcher" for="screen-select">
        Screen
        <select id="screen-select" aria-label="Select screen"></select>
      </label>
      <span class="mode" id="mode-label" aria-live="polite">Edit mode</span>
      <div class="frame-switcher" role="group" aria-label="Viewport width">
        <button type="button" class="ghost frame-btn" id="frame-phone" aria-pressed="false" title="Phone width (375 px)">Phone</button>
        <button type="button" class="ghost frame-btn" id="frame-tablet" aria-pressed="false" title="Tablet width (834 px)">Tablet</button>
        <button type="button" class="ghost frame-btn" id="frame-desktop" aria-pressed="true" title="Desktop width">Desktop</button>
      </div>
      <span class="spacer"></span>
      <button id="lint-chip" class="ghost lint-chip" type="button" aria-expanded="false" aria-controls="lint-panel" hidden title="Lint this scene (trd 11.3)">Lint</button>
      <button id="annotate-toggle" class="ghost" type="button" aria-pressed="false" title="Draw on the preview (pencil annotations)">Annotate</button>
      <button id="pin-toggle" class="ghost" type="button" aria-pressed="false" title="Place numbered pins with notes on the preview">Pin</button>
      <button id="send-btn" class="primary" disabled>Send changes</button>
      <div id="lint-panel" class="lint-panel" role="region" aria-label="Lint violations" hidden></div>
    </header>

    <main class="layout" role="main">
      <nav class="panel left" aria-label="Screens and layers">
        <h2 class="panel-title">Screens</h2>
        <ul id="screens-list" class="screens"></ul>
        <h2 class="panel-title layers-title">Layers</h2>
        <ul id="layers-list" class="layers" role="tree" aria-label="Layer tree"></ul>
      </nav>

      <section class="canvas-wrap" aria-label="Prototype canvas" tabindex="0">
        <div id="iframe-wrap" class="iframe-wrap">
          <iframe
            id="preview-frame"
            title="Prototype preview"
            sandbox="allow-scripts"
          ></iframe>
          <div id="overlay" class="overlay" aria-hidden="true"></div>
          <div id="pins-layer" class="pins-layer" role="group" aria-label="Annotation pins"></div>
          <canvas id="annotation-canvas" class="annotation-canvas" aria-label="Annotation drawing area"></canvas>
          <p id="canvas-error" class="canvas-error" hidden role="alert"></p>
        </div>
      </section>

      <section class="panel right" aria-label="Inspector and feedback">
        <div class="tabs" role="tablist" aria-label="Right panel">
          <button role="tab" id="tab-inspector" aria-selected="true" aria-controls="inspector-panel">Inspector</button>
          <button role="tab" id="tab-feedback" aria-selected="false" aria-controls="feedback-panel">Feedback</button>
          <button role="tab" id="tab-interview" aria-selected="false" aria-controls="interview-panel">Interview</button>
          <button role="tab" id="tab-profile" aria-selected="false" aria-controls="profile-panel">Profile</button>
        </div>

        <div id="inspector-panel" class="tabpanel" role="tabpanel" aria-labelledby="tab-inspector">
          <div id="inspector-body"></div>
        </div>

        <div id="interview-panel" class="tabpanel" role="tabpanel" aria-labelledby="tab-interview" hidden>
          <div id="interview-body"></div>
        </div>

        <div id="profile-panel" class="tabpanel" role="tabpanel" aria-labelledby="tab-profile" hidden>
          <div id="profile-body"></div>
        </div>

        <div id="feedback-panel" class="tabpanel" role="tabpanel" aria-labelledby="tab-feedback" hidden>
          <p class="feedback-target">Feedback for: <strong id="feedback-target">nothing selected</strong></p>
          <label for="feedback-text">What should change?</label>
          <textarea id="feedback-text" rows="4" maxlength="2000" placeholder="Describe the change…"></textarea>
          <fieldset class="chips-fieldset">
            <legend class="panel-title">Quick feedback</legend>
            <div class="chips" id="chips" role="group" aria-label="Quick feedback"></div>
          </fieldset>
          <fieldset class="chips-fieldset" id="annotations-fieldset" hidden>
            <legend class="panel-title">Annotations</legend>
            <ul id="annotations-list" class="annotations-list"></ul>
            <label class="attach-row" id="attach-annotations-row">
              <input type="checkbox" id="attach-annotations" checked />
              Attach open annotations to this feedback
            </label>
          </fieldset>
          <button id="add-to-queue" class="primary block-button">Add to queue</button>
        </div>
      </section>
    </main>

    <footer class="tray" aria-label="Patch queue">
      <button id="tray-toggle" class="tray-toggle" aria-expanded="false" aria-controls="tray-body">
        <span class="tray-caret" id="tray-caret" aria-hidden="true">▸</span>
        <span id="tray-summary" class="tray-summary">0 draft · 0 sent · 0 applied · 0 rejected · 0 conflict</span>
      </button>
      <div id="tray-body" class="tray-body" hidden>
        <ul id="queue-list" class="queue"></ul>
        <div id="waiting-banner" class="waiting" hidden>
          <span>Waiting for the agent. Ask your agent to check for feedback.</span>
          <button id="copy-prompt" class="icon-button">Copy prompt</button>
        </div>
      </div>
      <div id="tray-notice" class="tray-notice" hidden role="status"></div>
      <div id="watch-notice" class="tray-notice watch-notice" hidden role="status">Live updates are slower on this folder <button id="watch-notice-dismiss" class="watch-notice-dismiss" type="button" aria-label="Dismiss">×</button></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </footer>
  </body>
</html>
